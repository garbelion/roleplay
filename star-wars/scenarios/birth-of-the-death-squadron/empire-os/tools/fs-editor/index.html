<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Éditeur d'arborescence — empire-os</title>
  <style>
    :root { --bg:#0b0f0b; --fg:#33ff66; --dim:#1c6b32; --warn:#ffcc33; --danger:#ff4444; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Consolas","Courier New",monospace; }
    header { padding:12px 16px; border-bottom:1px solid var(--dim); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:15px; margin:0; letter-spacing:1px; }
    .grow { flex:1; }
    button { font:inherit; background:#0d160d; color:var(--fg); border:1px solid var(--dim); padding:3px 9px; cursor:pointer; border-radius:3px; }
    button:hover { background:var(--dim); color:var(--bg); }
    button.primary { border-color:var(--fg); }
    .layout { display:flex; gap:0; align-items:stretch; min-height:calc(100vh - 52px); }
    #tree { flex:1; padding:12px 16px; overflow:auto; }
    aside { width:300px; border-left:1px solid var(--dim); padding:12px 16px; background:#0a0d0a; }
    ul { list-style:none; margin:0; padding-left:20px; }
    #tree > ul { padding-left:0; }
    li { position:relative; }
    .row { display:flex; align-items:center; gap:6px; padding:2px 4px; border-radius:3px; }
    .row:hover { background:#0f1a0f; }
    .row.drop { outline:1px dashed var(--fg); background:#0f1a0f; }
    .row.problem { color:var(--warn); }
    .row.problem.miss { color:var(--danger); }
    .twist { width:14px; display:inline-block; cursor:pointer; color:var(--dim); user-select:none; }
    .icon { opacity:.75; }
    .nm { cursor:grab; }
    .badge { font-size:11px; border:1px solid currentColor; border-radius:3px; padding:0 4px; margin-left:4px; }
    .acts { display:flex; gap:2px; margin-left:6px; opacity:0; }
    .row:hover .acts { opacity:1; }
    .acts button { padding:0 6px; font-size:12px; line-height:20px; }
    aside h2 { font-size:13px; margin:0 0 8px; border-bottom:1px solid var(--dim); padding-bottom:4px; }
    .stat { display:flex; justify-content:space-between; padding:2px 0; }
    .stat.ok { color:var(--fg); } .stat.miss { color:var(--danger); } .stat.orph { color:var(--warn); } .stat.dup { color:var(--warn); }
    .detail { font-size:12px; color:var(--dim); margin:6px 0 10px; }
    .detail div { color:var(--warn); }
    .detail div.miss { color:var(--danger); }
    #msg { min-height:18px; font-size:12px; }
    #msg.err { color:var(--danger); }
    h2 .add { float:right; padding:0 6px; font-size:12px; line-height:18px; }
    .prop { display:flex; align-items:center; gap:4px; padding:1px 0; }
    .prop > span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
    .prop button { padding:0 5px; font-size:12px; line-height:18px; }
    #propaganda { max-height:38vh; overflow:auto; }
  </style>
</head>
<body>
  <header>
    <h1>▚ ÉDITEUR D'ARBORESCENCE</h1>
    <span class="grow"></span>
    <span id="msg"></span>
    <button id="add-disk">🖴 ＋ disque</button>
    <button id="rescan">↻ Rescan disque</button>
    <button id="reload">⟲ Recharger JSON</button>
    <button id="save" class="primary">💾 Enregistrer</button>
  </header>
  <div class="layout">
    <main id="tree"></main>
    <aside>
      <h2>SYNCHRONISATION</h2>
      <div id="stats"></div>
      <div id="details" class="detail"></div>
      <h2 style="margin-top:16px">PROPAGANDE <button id="add-prop" class="add" title="Nouveau message">＋</button></h2>
      <div id="propaganda"></div>
      <h2 style="margin-top:16px">AIDE</h2>
      <div class="detail" style="color:var(--dim)">
        Glisser un nœud sur un dossier pour l'y déplacer.<br>
        ⬆⬇ ordonne · ✎ renomme · ✖ retire.<br>
        Les fichiers réels restent à plat dans <b>public/fichiers/</b> :
        déplacer un nœud ne bouge aucun fichier. Un nom = un fichier physique.
      </div>
    </aside>
  </div>

  <script type="module">
    import { diffFileSystem } from "./fs-sync.js"
    import { addDisk, addFile, addDirectory, setCritical, addPropaganda, editPropaganda, removePropaganda } from "./fs-ops.js"

    let root = null            // racine JSON complète (session/console/children…)
    let files = []             // fichiers réellement présents sur le disque
    const collapsed = new Set() // nœuds repliés, par identité : survit aux renommages/déplacements
    let dragged = null, draggedParent = null
    const el = (id) => document.getElementById(id)

    function isAncestor(a, b) { // a contient-il b (ou a === b) ?
      return a === b || (a.children || []).some((c) => isAncestor(c, b))
    }
    function countFiles(node) {
      let n = node.type === "file" ? 1 : 0
      for (const c of node.children || []) n += countFiles(c)
      return n
    }

    async function load() {
      const { tree, files: f } = await (await fetch("/api/state")).json()
      root = tree; files = f; refresh(); flash("Chargé.")
    }

    // --- rendu ---------------------------------------------------------------
    function refresh() {
      const diff = diffFileSystem(root, files)
      const miss = new Set(diff.missing.map((m) => m.path))
      const dup = new Set(diff.duplicates.flatMap((d) => d.paths))
      el("tree").replaceChildren(renderChildren(root, "/", miss, dup))
      renderStats(diff)
      renderPropaganda()
    }

    function renderPropaganda() {
      const box = el("propaganda"); box.replaceChildren()
      const list = (root.console && root.console.propaganda) || []
      if (!list.length) {
        const d = document.createElement("div"); d.className = "detail"; d.textContent = "(aucun message)"
        box.appendChild(d); return
      }
      list.forEach((msg, i) => {
        const row = document.createElement("div"); row.className = "prop"
        const t = spanText(msg); t.title = msg
        row.append(t, mkBtn("✎", "Éditer", () => editProp(i)), mkBtn("✖", "Retirer", () => removeProp(i)))
        box.appendChild(row)
      })
    }
    function addProp() {
      const v = prompt("Nouveau message de propagande")
      if (v === null) return
      try { addPropaganda(root, v); renderPropaganda() } catch (e) { flash(e.message, true) }
    }
    function editProp(i) {
      const v = prompt("Éditer le message", root.console.propaganda[i])
      if (v === null) return
      try { editPropaganda(root, i, v); renderPropaganda() } catch (e) { flash(e.message, true) }
    }
    function removeProp(i) {
      if (!confirm("Retirer ce message ?\n\n" + root.console.propaganda[i])) return
      try { removePropaganda(root, i); renderPropaganda() } catch (e) { flash(e.message, true) }
    }

    function renderChildren(parent, basePath, miss, dup) {
      const ul = document.createElement("ul")
      for (const child of parent.children || []) {
        const path = basePath === "/" ? "/" + child.name : basePath + "/" + child.name
        ul.appendChild(renderNode(child, parent, path, miss, dup))
      }
      return ul
    }

    function renderNode(node, parent, path, miss, dup) {
      const li = document.createElement("li")
      const row = document.createElement("div")
      row.className = "row"
      const isFolder = node.type === "directory" || node.type === "disk"
      const isMiss = node.type === "file" && miss.has(path)
      const isDup = node.type === "file" && dup.has(path)
      if (isMiss || isDup) row.classList.add("problem", isMiss ? "miss" : "dup")

      const twist = document.createElement("span")
      twist.className = "twist"
      if (isFolder && (node.children || []).length) {
        twist.textContent = collapsed.has(node) ? "▸" : "▾"
        twist.onclick = () => { collapsed.has(node) ? collapsed.delete(node) : collapsed.add(node); refresh() }
      } else twist.textContent = " "
      row.appendChild(twist)

      const icon = document.createElement("span")
      icon.className = "icon"
      icon.textContent = node.type === "disk" ? "🖴" : node.type === "directory" ? "📁" : "📄"
      row.appendChild(icon)

      const nm = document.createElement("span")
      nm.className = "nm"
      nm.textContent = node.name
      nm.draggable = true
      nm.ondragstart = (e) => {
        dragged = node; draggedParent = parent
        e.dataTransfer.setData("text/plain", node.name); e.dataTransfer.effectAllowed = "move"
      }
      row.appendChild(nm)

      if (node.type === "disk") row.appendChild(badge("disque"))
      if (node.isCritical) row.appendChild(badge("critique"))
      if (isMiss || isDup) row.appendChild(badge(isMiss ? "manquant" : "doublon"))

      const acts = document.createElement("span")
      acts.className = "acts"
      if (isFolder) {
        acts.appendChild(mkBtn("＋📄", "Nouveau fichier", () => addChild(node, "file")))
        acts.appendChild(mkBtn("＋📁", "Nouveau dossier", () => addChild(node, "directory")))
      }
      if (node.type === "file") {
        acts.appendChild(mkBtn(node.isCritical ? "✪" : "☆", "Basculer « critique »", () => toggleCritical(node)))
      }
      acts.appendChild(mkBtn("✎", "Renommer", () => rename(node)))
      acts.appendChild(mkBtn("⬆", "Monter", () => reorder(parent, node, -1)))
      acts.appendChild(mkBtn("⬇", "Descendre", () => reorder(parent, node, +1)))
      acts.appendChild(mkBtn("✖", "Retirer", () => remove(parent, node)))
      row.appendChild(acts)

      if (isFolder) { // cible de drop : dossiers uniquement
        row.ondragover = (e) => { e.preventDefault(); row.classList.add("drop") }
        row.ondragleave = () => row.classList.remove("drop")
        row.ondrop = (e) => { e.preventDefault(); row.classList.remove("drop"); moveInto(node) }
      }

      li.appendChild(row)
      if (isFolder && !collapsed.has(node)) li.appendChild(renderChildren(node, path, miss, dup))
      return li
    }

    function badge(t) { const b = document.createElement("span"); b.className = "badge"; b.textContent = t; return b }
    function mkBtn(label, title, fn) {
      const b = document.createElement("button"); b.textContent = label; b.title = title; b.onclick = fn; return b
    }
    function spanText(t) { const s = document.createElement("span"); s.textContent = t; return s }

    function renderStats(diff) {
      el("stats").replaceChildren()
      addStat("ok", "✔ fichiers OK", Math.max(countFiles(root) - diff.missing.length, 0))
      addStat("miss", "⚠ manquants", diff.missing.length)
      addStat("orph", "⚠ orphelins", diff.orphans.length)
      addStat("dup", "⚠ doublons", diff.duplicates.length)
      el("details").replaceChildren()
      diff.missing.forEach((m) => addDetail("miss", `manquant : ${m.name}  (${m.path})`))
      diff.orphans.forEach((o) => addDetail("orph", `orphelin : ${o}  (présent, non déclaré)`))
      diff.duplicates.forEach((x) => addDetail("dup", `doublon : ${x.name}  → ${x.paths.join(" , ")}`))
    }
    function addStat(cls, label, n) {
      const s = document.createElement("div"); s.className = "stat " + (n ? cls : "ok")
      s.append(spanText(label), spanText(String(n))); el("stats").appendChild(s)
    }
    function addDetail(cls, txt) {
      const d = document.createElement("div"); d.className = cls; d.textContent = txt; el("details").appendChild(d)
    }

    // --- mutations -----------------------------------------------------------
    function addChild(folder, type) {
      const name = prompt(type === "file" ? "Nom du fichier (ex: note.md)" : "Nom du dossier")
      if (name === null) return
      try {
        if (type === "file") {
          const isCritical = confirm("Fichier critique (à télécharger par les PJ) ?")
          addFile(folder, name, { isCritical })
        } else {
          addDirectory(folder, name)
        }
        collapsed.delete(folder); refresh()
      } catch (e) { flash(e.message, true) }
    }
    function toggleCritical(node) {
      setCritical(node, !node.isCritical); refresh()
    }
    function rename(node) {
      const v = prompt("Nouveau nom", node.name)
      if (v && v !== node.name) { node.name = v; refresh() }
    }
    function remove(parent, node) {
      if ((node.children || []).length && !confirm(`Retirer « ${node.name} » et tout son contenu ?`)) return
      parent.children.splice(parent.children.indexOf(node), 1); refresh()
    }
    function reorder(parent, node, dir) {
      const i = parent.children.indexOf(node), j = i + dir
      if (j < 0 || j >= parent.children.length) return
      ;[parent.children[i], parent.children[j]] = [parent.children[j], parent.children[i]]; refresh()
    }
    function moveInto(folder) {
      if (!dragged || dragged === folder) return
      if (isAncestor(dragged, folder)) { flash("Impossible : cible dans le nœud déplacé.", true); return }
      draggedParent.children.splice(draggedParent.children.indexOf(dragged), 1)
      folder.children = folder.children || []
      folder.children.push(dragged)
      collapsed.delete(folder); refresh()
    }

    // --- actions -------------------------------------------------------------
    async function save() {
      try {
        const r = await (await fetch("/api/save", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(root),
        })).json()
        if (r.error) throw new Error(r.error)
        files = r.files; refresh()
        const warn = r.diff.missing.length + r.diff.orphans.length + r.diff.duplicates.length
        flash(warn ? `Enregistré — ${warn} alerte(s) de synchro.` : "Enregistré. Synchro OK.", warn > 0)
      } catch (e) { flash("Échec : " + e.message, true) }
    }
    function flash(t, err = false) { const m = el("msg"); m.textContent = t; m.className = err ? "err" : "" }

    el("add-prop").onclick = addProp
    el("add-disk").onclick = () => {
      const name = prompt("Nom du disque (ex: srv-archives)")
      if (name === null) return
      try { addDisk(root, name); refresh() } catch (e) { flash(e.message, true) }
    }
    el("save").onclick = save
    el("reload").onclick = load
    el("rescan").onclick = async () => {
      const { files: f } = await (await fetch("/api/state")).json(); files = f; refresh(); flash("Disque re-scanné.")
    }
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save() }
    })

    load()
  </script>
</body>
</html>
