<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISOS — Imperial Standard OS</title>
  <style>
    /* Palette impériale : sombre, froide, anguleuse. Change ici pour re-thémer. */
    :root {
      --bg: #05070b;            /* noir bleuté */
      --panel: #0e131b;         /* panneau ardoise */
      --panel-raised: #141c27;  /* panneau surélevé */
      --line: #26333f;          /* bordure acier froid */
      --line-strong: #374b5e;
      --ink: #b9c7d6;           /* texte blanc-bleu froid */
      --ink-dim: #6c7f92;       /* texte atténué */
      --accent: #4fb8cf;        /* cyan hologramme */
      --accent-bright: #86e5f5;
      --accent-soft: rgba(79, 184, 207, 0.14);
      --selection: rgba(79, 184, 207, 0.22);
      --danger: #cf4b45;        /* rouge impérial */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: "Consolas", "DejaVu Sans Mono", monospace;
    }

    #app { height: 100%; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
